name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compute next release version
        id: nextver
        run: |
          # Predict the next package version from pending changesets so the
          # release PR title and commit message can include the actual version
          # (e.g. "release: 2.3.0") instead of a generic "chore: release".
          npx changeset status --output=/tmp/changeset-status.json \
            || echo '{"releases":[]}' > /tmp/changeset-status.json
          NEXT=$(jq -r '.releases[] | select(.name=="@eins78/agent-skills") | .newVersion' \
            /tmp/changeset-status.json | head -n1)
          NEXT="${NEXT:-pending}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Create Release PR or Publish
        id: changesets
        # v2 pushes release commits and tags through the GitHub API by default,
        # which signs them with GitHub's web-flow key. That is what makes the
        # release commit show as Verified and satisfies the signed-commits rule
        # on main. Do not set push-with-git-cli: true — that reverts to the
        # unsigned git-CLI push this upgrade exists to fix.
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: bash .dev/scripts/create-release.sh
          commit-message: "release: ${{ steps.nextver.outputs.version }}"
          pr-title: "release: ${{ steps.nextver.outputs.version }}"
          # v2 no longer reads the GITHUB_TOKEN env var; the token must come
          # through this input, in both push modes.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assign release PR
        # Output renamed pull-request-number -> pr-number in v2. This one fails
        # silently if missed: the `if:` simply evaluates false and the step is
        # skipped, so the PR would just never get assigned.
        if: steps.changesets.outputs.pr-number
        env:
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "$PR_NUMBER" --add-assignee eins78
